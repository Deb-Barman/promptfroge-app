name: Android build

# Builds an installable APK. Run it from the Actions tab ("Run workflow") or push to main.
# No keystore is needed: the APK is signed with Flutter's debug key, which is fine for installing on your own phone.
# (Play Store uploads need a real keystore - see docs/RELEASING.md and the Release workflow.)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**', 'pubspec.yaml', 'tool/**', '.github/workflows/android-build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Generate / patch the android folder if it is not committed
        run: |
          if [ ! -d android ]; then tool/bootstrap.sh; else python3 tool/patch_platforms.py; flutter pub get; fi

      - name: Launcher icons
        run: |
          pip install --quiet pillow
          python3 tool/make_icons.py

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Name the files
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/PromptForge-${VERSION}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/PromptForge-${VERSION}-arm64-v8a.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PromptForge-android-apk
          path: dist/*.apk
