name: Build APK

# Builds ONE installable Android APK of the app. Nothing else (no tests, no release, no iOS).
#
# Run it:  push to main, or Actions tab > "Build APK" > Run workflow.
# Get it:  open the finished run > Artifacts > PromptForge-<version>.apk  (a plain .apk, no unzip needed).
#
# No secrets needed. The APK is signed with the debug key (fine for installing on your own phone).
# If an older build is already installed on the phone, uninstall it first.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  JAVA_VERSION: '17'
  APP_NAME: PromptForge
  ORG: com.promptforge

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Read app version
        id: meta
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      # The android/ folder is not committed, so it is generated here (Android only).
      - name: Generate android/ folder (if not committed)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org "$ORG" --project-name prompt_forge .
            rm -f test/widget_test.dart
          fi
          flutter pub get

      - name: Patch Android manifest (storage permissions + app name)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tool")
          import patch_platforms as pp
          pp.patch_manifest()
          if pp.failures:
              sys.exit(1)
          print("manifest patched")
          PY

      - name: Launcher icons
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 tool/make_icons.py

      # Old plugins (file_picker, ...) compile against Android API 34 but newer libraries need 36+.
      # This Gradle init script raises only those plugin modules to 36. It never lowers anything.
      - name: Raise compileSdk of old plugins (Gradle init script)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-compile-sdk.gradle" <<'EOF'
          beforeProject { p ->
              p.afterEvaluate { proj ->
                  def ext = proj.extensions.findByName("android")
                  if (ext == null || proj.name == "app") {
                      return
                  }
                  try {
                      def cur = ext.compileSdkVersion
                      def m = (cur == null ? "" : cur.toString()) =~ /android-(\d+)/
                      def curInt = m.find() ? m.group(1).toInteger() : 0
                      if (curInt > 0 && curInt < 36) {
                          ext.compileSdkVersion(36)
                          println "[force-compile-sdk] ${proj.path}: compileSdk ${curInt} -> 36"
                      }
                  } catch (Throwable t) {
                      println "[force-compile-sdk] ${proj.path}: skipped (${t.class.simpleName})"
                  }
              }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Name the APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APP_NAME}-${VERSION}.apk"
          ls -la dist

      # archive: false -> the APK is downloadable directly (not wrapped in a zip).
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
