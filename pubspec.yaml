name: prompt_forge
description: Prompt Forge - an offline, folder-based (Obsidian-style) prompt workspace. No AI calls, no backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  path: ^1.9.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Flutter does not recurse into asset folders, so each one is listed.
  assets:
    - assets/data/   # cl100k_base token vocabulary (exact GPT token counts) - gzip, ~450 KB
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Fira Code
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
